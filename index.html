<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<script src="index.js"></script>
<meta name="viewport" content="width=device-width">
<meta name="description" content="Una herramienta para contar las palabras de un texto. Para usarla, pega el texto en el área grande, arrastra texto desde un editor o arrastra y suelta un archivo. El texto se queda en tu navegador y no se sube a ningún servidor.">
<meta name="keywords" content="contador de palabras, palabras, contar, texto, texto plano">
<meta name="title" content="Contador de palabras">
<title>Contador de palabras</title>

<body data-drop-placeholder='¡Suelta el texto aquí!'>

  <h1>Cantidad de palabras: <span id="result">0</span></h1>
  
  <textarea id="t" placeholder="Para usarlo: (a) pega aquí tu texto, (b) arrastra y suelta texto desde otra ventana, o (c) arrastra y suelta archivos." autofocus></textarea>

</body>
</html>
